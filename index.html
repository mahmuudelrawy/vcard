<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Mahmoud Mahran</title>
    
    <!-- كود أيقونة حرف M الرصاصي الشفاف للتاب -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4,26 L4,6 L10,6 L16,16 L22,6 L28,6 L28,26 L23,26 L23,12 L17.5,21 L14.5,21 L9,12 L9,26 Z' fill='%23888888'/%3E%3C/svg%3E">

    <!-- ربط مكتبة FontAwesome الرسمية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- استدعاء خط Montserrat بالشكل الصحيح -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- تحميل صورة أول فريم قبل أي حاجة عشان تظهر فوراً -->
    <link rel="preload" as="image" href="poster.jpg" fetchpriority="high">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        
        <!-- حاوية الصورة والفيديو -->
        <div class="profile-img-container">
            <!-- أول فريم من الفيديو كصورة: بتظهر فوراً ومن غير أي شاشة سودا -->
            <img src="poster.jpg" class="profile-poster" alt="" aria-hidden="true">

            <!-- فيديو البروفايل: بيظهر فوق الصورة أول ما يبدأ يشتغل فعلاً -->
            <video id="profile-video" class="profile-video" poster="poster.jpg"
                   autoplay muted loop playsinline preload="auto"
                   disablepictureinpicture disableremoteplayback
                   aria-label="محمود مهران">
                <source src="profile.mp4" type="video/mp4">
            </video>
        </div>

        <!-- محتوى الكارت الداخلي -->
        <div class="card-content" id="card-content">
            
            <h1 class="name">Mahmoud Mahran</h1>
            
            <!-- المسمى الوظيفي التفاعلي بدون سهم -->
            <div class="title-container" id="title-container">
                <h2 class="title">IT-System-Elektroniker</h2>
                <div class="title-details" id="title-details">
                    <p>Auszubildender bei der <strong>PKE Deutschland GmbH</strong></p>
                </div>
            </div>

            <!-- زر الاتصال -->
            <button id="contact-btn" class="cta-button">Contact Me</button>

            <!-- قسم الأيقونات -->
            <div class="social-icons" id="social-icons">
                <a href="Mahmoud-Mahran.vcf" class="add-contact" aria-label="Add Contact"><i class="fa-solid fa-user-plus"></i></a>
                <a href="https://wa.me/4915222852550" target="_blank" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="tel:+4915222852550" class="phone"><i class="fa-solid fa-phone"></i></a>
                <a href="mailto:mahmuud.mahran@gmail.com" class="email"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://instagram.com/mahmoudelrawy" target="_blank" class="instagram"><i class="fa-brands fa-instagram"></i></a>
            </div>
            
            <p class="tagline">© 2026 Mahmoud Mahran. All Rights Reserved.</p>
            
        </div>

        <!-- الدخلة: بابين أسود بيتفتحوا على نور أبيض والكاميرا بتعدّي منهم -->
        <div class="intro-scene" id="intro-scene" aria-hidden="true">
            <div class="intro-light"></div>
            <div class="intro-doors">
                <div class="intro-door left"><div class="intro-shade"></div></div>
                <div class="intro-door right"><div class="intro-shade"></div></div>
            </div>
            <div class="intro-seam"></div>
        </div>

    </div>

<script>
    // التحكم في زر Contact Me وإظهار الأيقونات
    const contactBtn = document.getElementById('contact-btn');
    const socialIcons = document.getElementById('social-icons');

    contactBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        socialIcons.classList.toggle('show');
    });

    // التحكم في إظهار تفاصيل اللقب الوظيفي (PKE)
    const titleContainer = document.getElementById('title-container');
    const titleDetails = document.getElementById('title-details');

    titleContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        titleDetails.classList.toggle('show');
    });

    document.addEventListener('click', () => {
        socialIcons.classList.remove('show');
    });

    // فيديو البروفايل: بيفضل مخفي لحد ما يبدأ يتحرك فعلاً، وبعدين يظهر فوق الصورة
    const profileVideo = document.getElementById('profile-video');

    function showVideo() {
        profileVideo.classList.add('is-playing');
    }

    if (profileVideo) {
        profileVideo.addEventListener('playing', showVideo);
        if (!profileVideo.paused && profileVideo.readyState >= 3) showVideo();
    }

    // لو المتصفح منع التشغيل التلقائي (زي وضع توفير الطاقة في الأيفون)
    // الصورة بتفضل ظاهرة، ونحاول نشغل الفيديو تاني مع أول لمسة
    function tryPlayProfile() {
        if (profileVideo && profileVideo.paused) {
            profileVideo.play().catch(() => {});
        }
    }

    tryPlayProfile();
    document.addEventListener('touchstart', tryPlayProfile, { once: true, passive: true });
    document.addEventListener('click', tryPlayProfile, { once: true });
    // بعد ما الدخلة تخلص بنشيل طبقة الأبواب من الصفحة خالص
    setTimeout(() => {
        const introScene = document.getElementById('intro-scene');
        if (introScene) introScene.remove();
    }, 3200);

</script>
</body>
</html>
